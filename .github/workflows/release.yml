name: release

# Tag-driven, same as NEDB: push a v* tag and all three registries go.
#
# The matrices exist because a source-only release only works for people who
# already have a Rust toolchain, which is nobody's definition of shipping.
# Python gets abi3 wheels — one per platform, covering every Python 3.9 and up.
# Node gets a native addon per platform behind optionalDependencies. Then
# `pip install` and `npm i` both just work, on the machines people actually own.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing publishes unless the tests pass. A registry push is the one action
  # in this repo that cannot be taken back.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p hearth-core --all-targets

  crates:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: publish hearth-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # Already-published versions are not an error here: the crate may have
        # gone out on an earlier tag while another registry failed.
        run: cargo publish -p hearth-core --allow-dirty || echo "already published"

  # ---------------------------------------------------------------- python --
  wheels:
    needs: guard
    name: wheel ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  manylinux: auto }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, manylinux: auto }
          - { os: macos-latest,   target: x86_64-apple-darwin,       manylinux: "" }
          - { os: macos-latest,   target: aarch64-apple-darwin,      manylinux: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    manylinux: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: crates/hearth-py
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: crates/hearth-py/dist
          if-no-files-found: error

  sdist:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: crates/hearth-py
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/hearth-py/dist
          if-no-files-found: error

  pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{wheel-*,sdist}"
          merge-multiple: true
      - run: ls -la dist
      - name: publish
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --skip-existing dist/*

  # ------------------------------------------------------------------ node --
  addons:
    needs: guard
    name: addon ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build addon
        working-directory: crates/hearth-node
        run: |
          npm install
          npx napi build --platform --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.target }}
          path: crates/hearth-node/*.node
          if-no-files-found: error

  npm:
    needs: addons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - working-directory: crates/hearth-node
        run: npm install
      - uses: actions/download-artifact@v4
        with:
          path: crates/hearth-node/artifacts
          pattern: addon-*
          merge-multiple: true
      - name: assemble platform packages
        working-directory: crates/hearth-node
        # The npm/<platform>/ directories are committed, so `artifacts` has
        # somewhere to copy each addon. v0.1.1 failed exactly here: all four
        # .node files downloaded fine and there was nowhere to put them.
        run: |
          ls -la artifacts
          npx napi artifacts --dir artifacts
          for d in npm/*/; do echo "$d"; ls -la "$d"; done
      - name: publish
        working-directory: crates/hearth-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # prepublish pushes each per-platform package; the main package's
        # optionalDependencies then resolve to whichever one fits the installer.
        # No `|| true` anywhere here on purpose. Masking a publish failure is
        # how v0.1.0 shipped a Node addon that silently ate its own input —
        # a step that cannot fail is a step that cannot tell you anything.
        run: |
          npx napi prepublish -t npm --skip-gh-release
          npm publish --access public
