[workspace]
resolver = "2"
members = ["crates/hearth-core", "crates/hearth-node", "crates/hearth-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/aiassistsecure/hearth"
authors = ["Interchained LLC"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
