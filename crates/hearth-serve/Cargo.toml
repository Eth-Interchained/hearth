[package]
name = "hearth-serve"
description = "The hearth supervisor: llama-server children, honest health probes, and a NEDB event spine from commit one."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["llm", "supervisor", "llama-cpp", "gpu", "serving"]
categories = ["command-line-utilities", "network-programming"]
documentation = "https://docs.rs/hearth-serve"
homepage.workspace = true
authors.workspace = true

[dependencies]
hearth-core = { path = "../hearth-core", version = "0.4.0" }
hearth-store = { path = "../hearth-store", version = "0.4.0" }
hearth-pull = { path = "../hearth-pull", version = "0.4.0" }
hearth-api = { path = "../hearth-api", version = "0.4.0" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "hearth"
path = "src/bin/hearth.rs"
