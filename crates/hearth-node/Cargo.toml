[package]
name = "hearth-node"
description = "Node.js bindings for hearth — deterministic model residency."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
hearth-core = { path = "../hearth-core", version = "0.3.9" }
napi = { version = "2", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "2"
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"
