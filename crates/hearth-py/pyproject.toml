[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "hearth-engine"
version = "0.3.3"
description = "Deterministic model residency — keep declared models warm, and tell the truth about which ones are."
readme = "README.md"
license = { text = "BUSL-1.1" }
requires-python = ">=3.9"
authors = [{ name = "Interchained LLC" }]
keywords = ["llm", "inference", "gpu", "vram", "residency", "ollama", "llama.cpp"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/aiassistsecure/hearth"
Repository = "https://github.com/aiassistsecure/hearth"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "hearth._hearth"
python-source = "python"
manifest-path = "Cargo.toml"
