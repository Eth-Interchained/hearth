[package]
name = "hearth-py"
description = "Python bindings for hearth — deterministic model residency."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "_hearth"
crate-type = ["cdylib"]

[dependencies]
hearth-core = { path = "../hearth-core", version = "0.3.0" }
# abi3-py39: ONE wheel per platform covers every Python from 3.9 up, instead
# of a separate build per minor version. Fewer artifacts, and a user on a
# Python we never built for still gets a binary instead of a compiler error.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
serde_json = { workspace = true }
